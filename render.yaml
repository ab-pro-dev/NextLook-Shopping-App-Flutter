services:
  - type: static
    name: nextlook-admin-dashboard
    repo: https://github.com/ab-pro-dev/NextLook-Shopping-App-Flutter
    branch: main
    rootDir: admin_dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
